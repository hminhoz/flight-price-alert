name: flight-price-check

on:
  schedule:
    - cron: "43 * * * *"     # 1시간마다 시도. GitHub이 절반을 지연/생략해도
                             # 커서 샤딩이라 누락 없이 하루 8회+ 확보 (v1.6)
  workflow_dispatch:          # 수동 실행 버튼 (테스트용)
    inputs:
      dry_run:
        description: "DRY_RUN (1이면 텔레그램 대신 로그 출력)"
        default: ""

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false   # 이전 실행이 끝날 때까지 대기 (커밋 충돌 방지)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run price check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python main.py

      - name: Commit state
        run: |
          git config user.name "price-bot"
          git config user.email "actions@users.noreply.github.com"
          # 루트에 남은 app/ 옛 사본을 지운다. 웹 UI 업로드는 파일을 지우지
          # 않아 사본이 쌓였다(실제로 9개). import는 app/ 을 쓰므로 동작엔
          # 영향이 없지만, 열어보면 어느 쪽이 진짜인지 헷갈린다.
          # **루트 경로만** 지정한다 — app/ 안의 같은 이름 파일은 진짜다.
          for f in engine.py gparse.py links.py notify.py search.py \
                   settings.py state.py test_pipeline.py price-check.yml; do
            if [ -f "$f" ]; then
              git rm -q "$f"
              echo "루트 옛 사본 삭제: $f"
            fi
          done
          git add data/ .gitignore
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: price data $(date -u +'%Y-%m-%d %H:%M')"
            # 동시 푸시 충돌 대비 재시도
            for i in 1 2 3; do
              git push && break
              git pull --rebase && sleep 3
            done
          fi
