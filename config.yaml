# =============================================
# 항공권 최저가 알림 - 검색 조건 설정
# 이 파일만 수정하면 조건이 바뀝니다. (코드 수정 불필요)
# =============================================

search:
  period:                     # 여행 가능 기간 (출발·귀국 모두 포함)
    start: "2026-08-01"
    end: "2026-10-31"
  trip_nights: [3, 4]         # 여행 일수 (박 수, 복수 지정 가능)
  outbound_departure:         # 가는 편 출발 시각 범위
    earliest: "06:00"
    latest: "13:00"
  return_departure:           # 오는 편 출발 시각 범위
    earliest: "18:00"
    latest: "23:59"
  direct_only: true
  # 네이버 보조 수집 (v1.69). 국내선에서만 이득이 확인돼 제주만 대상.
  #   실측 2026-07-26: 김포-제주 -29% / 오사카 +10% / 후쿠오카 -2%
  # 브라우저를 띄워야 해서 무겁다 → 하루 1회, 예산 상한 안에서만.
  naver_routes: ["GMP-CJU"]   # 비우면 네이버 수집을 하지 않는다
  naver_hour: 5               # KST 이 시각부터 수집 시작 (그 전에는 쉰다)
  naver_runs_per_day: 3       # 하루 최대 몇 번의 실행에서 이어받을지.
                              # 1회로는 145건을 다 못 채워 뒷부분이 계속 밀린다.
                              # 3회면 하루 안에 한 바퀴가 돈다.
  naver_budget_min: 25        # 이 시간을 넘기면 **거기서 멈추고 다음 실행이
                              # 이어받는다**(버리지 않는다). 전체 약 144건이라
                              # 한 바퀴에 이틀쯤 걸린다.
  exclude_airlines: [MM, PEACH]   # 아예 후보에서 뺄 항공사. MM = 피치항공.
                              # 2글자는 IATA 코드로, 3글자 이상은 항공사명
                              # 부분일치로 본다. 코드가 안 잡히는 응답까지
                              # 걸러내려고 이름도 같이 넣어둔다.
                              # 되살리려면 목록에서 지우면 된다.
  cross_airports: true        # 서울 출발/도착 공항 교차 조합 허용 (v1.41)
                              # 예: 김포→나고야 가고, 나고야→인천 오기.
                              # 실측에서 1인 최대 184,600원 절감. 추가 검색 0건
                              # (네 방향 다리를 이미 다 수집하므로 짝만 다르게 짓는다)
  city_groups:                # 같은 도시의 복수 공항을 하나로 묶어 교차 허용
    도쿄: [HND, NRT]           # 하네다로 들어가 나리타로 나오기
  exclude_departures: []      # 출발일 제외. 예: ["2026-09-24", "2026-10-01~2026-10-05"]
  exclude_weekdays: ["일", "월", "화"]  # 출발 요일 제외 (귀국편은 무관)
  adults: 2
  currency: "KRW"

# 노선별 "넓힌" 시간창 (v1.34에서 규칙 확정)
#   대상: 선호 시간대에 항공편이 거의 없는 노선만. 2026-07-26 실측 근거 —
#     ICN→KOJ 가는 편: 선호 창(06~13시) 안 1/14건(7%), 나머지는 16시대
#     CTS→ICN 오는 편: 선호 창(18시~) 안 2/18건(11%), 나머지는 14·16시대
#   동작: 이 노선은 넓힌 창을 검색 범위로 쓰고 그 안에서 최저가를 고른다.
#     오전 편이 드물게 있어도 우선하지 않는다 — 애초에 "이 노선엔 선호 시간
#     편이 없다"고 인정해서 넓힌 것이므로 다시 오전 우선을 씌우면 모순이고,
#     드물게 있는 비싼 오전 편을 '특가'라며 알리게 된다.
#   대신 채택된 편이 선호 시간 밖이면 알림에 반드시 표시한다:
#     "⚠️ 가는 편은 선호 시간대에 편이 없어 다른 시간대로 잡았습니다"
#   넓힌 창이 없는 나머지 7개 노선은 선호 창이 절대 기준이다 (변화 없음).
#   earliest·latest 중 한쪽만 써도 되고, 안 쓴 쪽 경계는 전역값을 따른다.
#   ※ 노선별 시간 분포는 실행 로그의 "시간 분포" 줄에서 확인할 것.
routes:
  # ---- 구글 소스로 정상 가동 중인 노선 ----
  - { origin: ICN, destination: NGO, label: "인천-나고야" }
  - { origin: ICN, destination: CTS, label: "인천-삿포로",
      # CTS→ICN 은 저녁 출발편이 거의 없음 (실측: 오는 편 가격 확보 1/58)
      # 15:00 으로는 14:30 출발편이 30분 차이로 탈락 → 14:00 (v1.12.1)
      return_departure: { earliest: "14:00" } }
  - { origin: GMP, destination: HND, label: "김포-하네다" }
  # 김포발 일본 취항지는 도쿄·오사카·나고야 셋뿐 (한국공항공사 기준).
  # 인천만 넣고 김포 짝을 빠뜨렸던 두 노선을 채운다.
  - { origin: GMP, destination: KIX, label: "김포-오사카" }
  # 김포-나고야는 **피치 단독 취항**이라 exclude_airlines에 MM이 있는 한
  # 검색해도 결과가 0이다(실측 113개 다리 → 0개). 매 바퀴 113건을 버리게 되므로
  # 꺼둔다. 피치를 다시 허용하면 아래 주석을 풀 것.
  # - { origin: GMP, destination: NGO, label: "김포-나고야",
  #     return_departure: { earliest: "14:00" } }
  - { origin: ICN, destination: OKA, label: "인천-오키나와" }
  - { origin: ICN, destination: KOJ, label: "인천-가고시마",
      # ICN→KOJ 출발편은 12:47·15:45 등 오후 편중 (실측: 가는 편 0/39)
      # 16:00 으로는 대한항공 16:20 편이 20분 차이로 탈락 → 17:00 (v1.12.1)
      outbound_departure: { latest: "17:00" } }
  # ---- 시험 부활 (v1.21) ----
  # 구글이 이 노선들에 간헐적으로 오류를 주지만, 실측상 9번 중 5번은 정상
  # 데이터가 왔다. 관대 파서(app/gparse.py)가 그걸 건질 수 있으므로 켜본다.
  # 몇 번 실행 후 노선별 통계에서 가격확보가 너무 적으면 다시 주석 처리할 것.
  - { origin: ICN, destination: KIX, label: "인천-오사카" }
  - { origin: ICN, destination: FUK, label: "인천-후쿠오카" }
  # 나리타도 오사카·후쿠오카와 같은 파서 문제였을 가능성이 커서 함께 켠다
  - { origin: ICN, destination: NRT, label: "인천-나리타" }
  # 제주: 구글에 한국 국내선 데이터가 없다고 판정했으나(v1.10) 그 판정도
  # 파서 실패에 근거했을 수 있어 한 번 확인한다. 통계 보고 아니면 다시 끈다.
  - { origin: GMP, destination: CJU, label: "김포-제주", domestic: true }
  # ---- 여전히 휴면 ----
  # - { origin: ICN, destination: HND, label: "인천-하네다" }
  #   야간 전용 노선이라 조건상 불가. 밤에 인천 출발 → 새벽 하네다 도착,
  #   복편은 새벽 1~2시 하네다 출발. "가는 편 06~13시"에 원천적으로 안 걸린다.
  #   예전의 "경유편만 반환" 판정도 실은 이것 때문이었다 (파서 문제 아님).
  # - { origin: GMP, destination: NRT, label: "김포-나리타" }
  #   존재하지 않는 노선. 인천공항 개항 이후 운항 이력 없음.
  # - { origin: ICN, destination: CJU, label: "인천-제주", domestic: true }
  #   → 김포-제주가 되면 이것도 켠다

schedule:
  shards: 2                   # 실행마다 다음 샤드 순환(커서 방식). 2회 실행 = 전 조합 1바퀴
                              # 실측(2026-07-26): leg당 3.4초, 전체 1017 leg.
                              #   샤드 6 → 1회 12분 / 한 바퀴 6시간
                              # ↑ 위 수치는 순차 실행 기준. v1.30 동시검색(3) 이후
                              # 실측은 432건에 5분 36초 = 분당 78건.
                              #   샤드 3 → 1회 6분 / 한 바퀴 3시간
                              #   샤드 2 → 1회 7분 / 한 바퀴 2시간  ← 현재
                              #   샤드 1 → 1회 13분 / 한 바퀴 1시간
                              # 샤드 1도 시간상 여유롭다. 다만 하루 총 요청이
                              # 1만→2.4만 건으로 늘고, 항공권 가격이 1시간 단위로
                              # 움직이진 않아 실익이 크지 않다. 필요하면 1로.
                              # 워크플로우 제한 75분이라 2까지도 여유는 있으나,
                              # GitHub 예약 실행이 자주 지연·생략돼 실패 시 손실이
                              # 커진다. 3이 균형점.
  imminent_days: 5            # 임박: 출발 N일 이내 → 매 실행(2시간마다) 체크
  attention_days: 21          # 주시: 출발 N일 이내 → 하루 2회 (단거리 최저가 형성 구간)
  request_delay_sec: [1, 2]   # 요청 간 무작위 대기 (차단 방지). 작업자별로 적용된다
  concurrency: 3              # 동시에 검색할 leg 수 (v1.30)
                              # 1 = 기존 순차. 3이면 실행 시간이 대략 1/3.
                              # 요청 간 대기는 작업자마다 그대로 지켜지므로
                              # 초당 요청은 concurrency/평균대기 = 3/1.5 = 2건 수준.
                              # 실패가 늘면 2나 1로 낮출 것 (로그의 '실패' 항목 확인)

alerts:
  baseline_unit: "route_month"   # 기준가 단위: 노선 × 월
  observation_days: 2            # 가동 초기 관측 기간 (알림 억제, 수집만)
                                 # 첫 실행 2026-07-24 기준: 4→2로 줄여 7/26부터 알림.
                                 # 기준가가 이틀치 관측으로 만들어져 다소 거칠지만,
                                 # 기준가 = 관측 최저가라 알림이 남발되진 않는다.
  baseline_recalc_window: 14     # 최근 N일 기준 기준가 하향 재계산
  dedup: "lower_price_only"      # 같은 조합은 직전 알림가보다 낮을 때만 재알림
  bundle_top_n: 3                # 같은 노선 다수 조건 충족 시 묶음 알림 최대 개수
  bundle_min_gap_pct: 3          # 묶음 안에서 바로 앞 항목보다 이만큼은 비싸야
                                 # 별도 줄로 보여준다. 1~2% 차이나는 옆 날짜를
                                 # 3줄로 늘어놓는 대신 아래 '유사 가격대'에 맡긴다
  similar_margin_pct: 15         # 알림에 '최저가 +N% 이내 다른 날짜'도 함께 표시
                                 # 10%로는 후보가 1~2개뿐인 노선이 많아 15%로
  similar_top_n: 4               # 위 유사가격 날짜 최대 표시 개수
  live_board: true               # 실행마다 갱신되는 '고정판' 한 통 유지 (v1.47)
                                 # 텔레그램은 봇이 자기 메시지를 수정할 수 있고
                                 # 수정은 알림이 울리지 않는다. 방에 고정해두면
                                 # 알림 없이 항상 최신 시세를 볼 수 있다.
                                 # 푸시 알림은 진짜 특가에만 쓰는 구조가 된다.
  board_top_n: 8                 # 고정판에서 도시별로 보여줄 최대 날짜 수.
                                 # 한 통(4096자)에 안 들어가면 자동으로 줄인다.
  digest_top_n: 6                # DRY_RUN=digest 로 요청할 때 도시별 날짜 수.
                                 # 고정판과 달리 여러 통으로 나눠 보낼 수 있어
                                 # 길이 제약이 덜하다. 날짜마다 링크가 붙는다.
  digest_hour: 9                 # 하루 1회 요약 푸시 시각 (KST). 아래 cycle_report가
                                 # off면 쓰이지 않는다 — 고정판이 그 역할을 한다
  cycle_report: "off"              # 하루 1회 시세 요약 푸시. 고정판이 그 역할을
                                 # 대신하므로 기본 off. 매일 아침 푸시로도 받고
                                 # 싶으면 daily 로 바꿀 것
                                 #   daily = 하루 첫 완주 때만 (기본)
                                 #   every = 완주할 때마다 (샤드 3이면 하루 8번)
                                 #   off   = 로그에만 남기고 알림 안 함
  min_below_baseline_pct: 2      # '기준가 이하' 알림은 기준가보다 이만큼은 싸야 발송.
                                 # 0이면 기준가와 같기만 해도 알림이 가서, 실측상
                                 # 알림 90건 중 55건이 1% 미만 차이였다 (특가 아님).
                                 # 역대 최저 갱신은 이 조건과 무관하게 항상 알린다.
  min_redrop_pct: 2              # 재알림 최소 하락폭. 직전 알림가보다 이만큼은
                                 # 더 싸져야 다시 알린다 (1천원 내려서 또 오는 것 방지)
  verify_roundtrip: true         # 알림 직전 왕복 실가 재조회 (v1.12, 아래 설명)
  verify_max_queries: 6          # 실행당 왕복 검증 쿼리 상한
# ── 왕복 검증이 필요한 이유 ──────────────────────────────
# 이 시스템은 오는 편 시간 조건을 걸기 위해 편도 2회로 나눠 검색한다. 그런데
# 일본 출발 편도 요금은 한국 발권 왕복보다 훨씬 비싸서(실측 1.5~2배) 편도
# 합산가는 실구매가가 아니다. 그래서 편도 합산가는 '변동 감지 지표'로만 쓰고,
# 알림이 확정된 조합만 왕복으로 다시 조회해 실제 금액을 메시지에 싣는다.
# 기준가는 감지 지표와 같은 척도라 리셋 없이 그대로 유지된다.

errors:
  retry: 3
  failure_alert_threshold: 0.5   # 실패율 50% 초과가
  failure_alert_streak: 2        # 연속 2회 실행 지속되면 이상 알림
  failure_alert_cooldown_hours: 6
