# =============================================
# 항공권 최저가 알림 - 검색 조건 설정
# 이 파일만 수정하면 조건이 바뀝니다. (코드 수정 불필요)
# =============================================

search:
  period:                     # 여행 가능 기간 (출발·귀국 모두 포함)
    start: "2026-08-01"
    end: "2026-10-31"
  trip_nights: [3, 4]         # 여행 일수 (박 수, 복수 지정 가능)
  outbound_departure:         # 가는 편 출발 시각 범위
    earliest: "06:00"
    latest: "13:00"
  return_departure:           # 오는 편 출발 시각 범위
    earliest: "18:00"
    latest: "23:59"
  direct_only: true
  exclude_departures: []      # 출발일 제외. 예: ["2026-09-24", "2026-10-01~2026-10-05"]
  exclude_weekdays: ["일", "월", "화"]  # 출발 요일 제외 (귀국편은 무관)
  adults: 2
  currency: "KRW"

# 노선별 시간창 override (v1.11)
#   전역 시간창은 노선마다 다른 운항 스케줄을 반영하지 못해 일부 노선을 죽인다.
#   아래처럼 outbound_departure / return_departure 를 노선에 직접 붙이면 그
#   노선만 덮어쓴다. earliest·latest 중 하나만 써도 되고, 안 쓴 쪽은 전역값 유지.
routes:
  # ---- 구글 소스로 정상 가동 중인 노선 ----
  - { origin: ICN, destination: NGO, label: "인천-나고야" }
  - { origin: ICN, destination: CTS, label: "인천-삿포로",
      # CTS→ICN 은 저녁 출발편이 거의 없음 (실측: 오는 편 가격 확보 1/58)
      # 15:00 으로는 14:30 출발편이 30분 차이로 탈락 → 14:00 (v1.12.1)
      return_departure: { earliest: "14:00" } }
  - { origin: GMP, destination: HND, label: "김포-하네다" }
  - { origin: ICN, destination: OKA, label: "인천-오키나와" }
  - { origin: ICN, destination: KOJ, label: "인천-가고시마",
      # ICN→KOJ 출발편은 12:47·15:45 등 오후 편중 (실측: 가는 편 0/39)
      # 16:00 으로는 대한항공 16:20 편이 20분 차이로 탈락 → 17:00 (v1.12.1)
      outbound_departure: { latest: "17:00" } }
  # ---- 구글 불가 확정 → 네이버 소스(v2) 개발 후 부활시킬 것 (2026-07-25 진단) ----
  # - { origin: ICN, destination: KIX, label: "인천-오사카" }
  # - { origin: ICN, destination: NRT, label: "인천-나리타" }
  # - { origin: ICN, destination: HND, label: "인천-하네다" }
  # - { origin: ICN, destination: FUK, label: "인천-후쿠오카" }
  # - { origin: ICN, destination: CJU, label: "인천-제주", domestic: true }
  # - { origin: GMP, destination: CJU, label: "김포-제주", domestic: true }

schedule:
  shards: 6                   # 실행마다 다음 샤드 순환(커서 방식). 6회 실행 = 전 조합 1바퀴
  imminent_days: 5            # 임박: 출발 N일 이내 → 매 실행(2시간마다) 체크
  attention_days: 21          # 주시: 출발 N일 이내 → 하루 2회 (단거리 최저가 형성 구간)
  request_delay_sec: [1, 2]   # 요청 간 무작위 대기 (차단 방지)

alerts:
  baseline_unit: "route_month"   # 기준가 단위: 노선 × 월
  observation_days: 4            # 가동 초기 관측 기간 (알림 억제, 수집만)
  baseline_recalc_window: 14     # 최근 N일 기준 기준가 하향 재계산
  dedup: "lower_price_only"      # 같은 조합은 직전 알림가보다 낮을 때만 재알림
  bundle_top_n: 3                # 같은 노선 다수 조건 충족 시 묶음 알림 최대 개수
  similar_margin_pct: 10         # 알림에 '최저가 +N% 이내 다른 날짜'도 함께 표시
  similar_top_n: 4               # 위 유사가격 날짜 최대 표시 개수
  verify_roundtrip: true         # 알림 직전 왕복 실가 재조회 (v1.12, 아래 설명)
  verify_max_queries: 6          # 실행당 왕복 검증 쿼리 상한
# ── 왕복 검증이 필요한 이유 ──────────────────────────────
# 이 시스템은 오는 편 시간 조건을 걸기 위해 편도 2회로 나눠 검색한다. 그런데
# 일본 출발 편도 요금은 한국 발권 왕복보다 훨씬 비싸서(실측 1.5~2배) 편도
# 합산가는 실구매가가 아니다. 그래서 편도 합산가는 '변동 감지 지표'로만 쓰고,
# 알림이 확정된 조합만 왕복으로 다시 조회해 실제 금액을 메시지에 싣는다.
# 기준가는 감지 지표와 같은 척도라 리셋 없이 그대로 유지된다.

errors:
  retry: 3
  failure_alert_threshold: 0.5   # 실패율 50% 초과가
  failure_alert_streak: 2        # 연속 2회 실행 지속되면 이상 알림
  failure_alert_cooldown_hours: 6
